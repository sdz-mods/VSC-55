; VSC-55 A00 settings. Lines beginning with ; are comments.
; Keep this file beside VSCCFG.EXE and VSC55.EXE (normally C:\VSC-55).
; For manual edits, Exit VSC-55 from the tray first, edit/save this file,
; then reopen the panel. This prevents the GUI overwriting your edits.
; Prefer the Settings controls and Save settings for normal changes.
; The panel starts STOPPED by default; [Synth] AutoStart can change this.
; INSTALL.BAT preserves an existing INI, including on upgrades.

[Synth]
; Automatically start emulation when the GUI launches (including Windows
; startup): 0 = stay stopped (default), 1 = start using the saved settings.
; Missing/other values stay stopped. Requires valid ROMs and an audio device.
; The Settings checkbox "Start emulation when VSC-55 opens" edits this value.
; Click Save settings. It does not immediately start or stop emulation.
; Applies on the next GUI launch, not when reopening its window from the tray.
; Stop remains stopped until you press Start or relaunch the GUI. Failed
; startup is not retried automatically. Emulation uses CPU even when silent.
AutoStart=0

; Selected model and firmware. Prefer choosing it in Settings.
; Values: mk1-v1.00, mk1-v1.10, mk1-v1.20, mk1-v1.21, mk1-v2.00,
;         mk2-v1.01, mk2-ctf-sc55-drum-sc55-v1.21 (CTF-patched mkII).
; Missing/unrecognized values select mk1-v1.21. Needs Stop/Start when
; changed through Settings. Each selection needs its matching ROM dumps.
Model=mk1-v1.21

[Audio]
; Output sample rate in Hz: 11025, 16000, 22050, 32000, 44100 or 48000.
; Default 48000; missing/unsupported values also use 48000.
; Output stays 16-bit stereo. The core still generates 64000 Hz (SC-55)
; or 66207 Hz (mkII), with oversampling enabled, then resamples to this rate.
; Lower rates reduce audio bandwidth, not the core's emulation workload.
; This does not change pitch or tempo. Leave at 48000 unless needed.
; The sound driver must accept the chosen format; if it rejects it,
; startup fails (no automatic device-format fallback). Check VSC55.LOG.
; Choose Sample rate in Settings while stopped, then Save settings or Start.
; Applies on the next Start. Manual edits require exiting/reopening the GUI
; so its saved selection does not overwrite your edit. The command-line
; host reads this entry on each Start as well.
SampleRate=48000

; Windows sound output device name, exactly as shown in Settings.
; "Default sound device" uses Windows' default waveOut device. An unavailable
; saved device prevents Start; select another device in Settings.
; Prefer selecting the device in Settings; changes need Stop/Start.
Device=Default sound device

; Duration of each audio buffer in milliseconds, rounded to whole samples.
; Use with BufferCount below. Supported GUI pairs (ms x count):
;   10 x 4, 20 x 4, 40 x 4, 80 x 4, 20 x 8, 10 x 16.
; Default 20 x 8 = approximately 160 ms of queued audio. Other pairs fall
; back to 20 x 8 in the GUI. Prefer the Buffer size list in Settings.
; Larger queues can tolerate longer scheduling delays but add latency;
; smaller queues reduce latency but may stutter. Changes need Stop/Start.
BufferMs=20

; Number of queued buffers. Use one of the BufferMs/BufferCount pairs above.
; Total queue duration is approximately BufferMs multiplied by BufferCount.
; If omitted: 8 for BufferMs=20, otherwise 4.
BufferCount=8

; Output gain in percent: 0-1600. Default 100 = unity; 0 = silent output.
; 200 doubles amplitude (about +6 dB); high values can clip loud passages.
; Gain is applied after emulation; it does not change MIDI channel volumes.
; Muting output here does not stop emulation or reduce its CPU workload.
; Invalid values use 100. GUI slider/knob changes apply live; use Settings
; Save to persist them. Manual file edits are loaded when the GUI starts.
Volume=100

[ROMs]
; One ROM directory per model/firmware. Settings writes these entries when
; saved. Missing entries use ROMS beneath the application directory.
; The examples below show the normal installation layout; leave commented
; to use automatic defaults, or remove the leading ; to override a path.
; Use full directory paths. ROMs are identified by their contents, not names;
; each directory must contain a complete matching set. ROMs are not supplied.
; Model names on the left match the [Synth] Model values above.
; mk1-v1.00=C:\VSC-55\ROMS\MK1\1.00
; mk1-v1.10=C:\VSC-55\ROMS\MK1\1.10
; mk1-v1.20=C:\VSC-55\ROMS\MK1\1.20
; mk1-v1.21=C:\VSC-55\ROMS\MK1\1.21
; mk1-v2.00=C:\VSC-55\ROMS\MK1\2.00
; mk2-v1.01=C:\VSC-55\ROMS\MK2\1.01
; mk2-ctf-sc55-drum-sc55-v1.21=C:\VSC-55\ROMS\MK2\CTF1.01

[FrontPanel]
; LCD contrast, 1-16. Default 8; out-of-range values also use 8.
; The LCD contrast menu applies and saves changes immediately.
; Manual edits take effect when the GUI next starts. Audio is unaffected.
Contrast=8

; The GUI automatically saves X, Y, Width and Height here when the front
; panel moves/resizes. All are in screen pixels: X/Y are the outer window's
; top-left position, Width/Height include its frame and menu.
; Prefer moving/resizing the window or using its Size menu.
; Delete these four entries to restore automatic sizing/placement on the
; next GUI launch. Missing values adapt to the available desktop area;
; loaded dimensions/position are constrained to that area.
; Width has a minimum of 560 and Height 190, subject to the desktop size.
